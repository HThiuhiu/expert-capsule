name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  skill-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Phiên bản trong tag khớp phiên bản trong mã
        run: test "v$(python -c 'import capsule; print(capsule.__version__)')" = "${GITHUB_REF_NAME}"
      - run: python scripts/build_skill_zip.py dist
      - name: Tạo GitHub Release kèm file zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/expert-capsule-skill.zip \
            --title "Expert Capsule ${GITHUB_REF_NAME}" \
            --notes "Skill Expert Capsule. Claude Code: /plugin install expert-capsule --marketplace HThiuhiu/expert-capsule. Claude.ai: tải expert-capsule-skill.zip, rồi Settings > Capabilities > Skills > Upload skill. Xem README."
