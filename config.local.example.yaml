# Mẫu đầy đủ cho config.local.yaml của thư mục làm việc (`capsule init` tạo sẵn một bản gọn). Khoá nào ghi ở
# đây sẽ đè lên mặc định trong package (src/pc/config.default.yaml). File này không bao giờ lên git.

capsule:
  owner_name: "Tên của bạn"     # hiện trong SKILL.md: "Cách làm việc của <tên>"
  slug: ten-ban                 # capsule ra ở expert/expert-<slug>/
  # embed: "local"              # bật đặc trưng "lặp lại yêu cầu" (cần pip install -e ".[embed]")

# Chọn MỘT trong các cách chạy model dưới đây (bỏ dấu # ở khối muốn dùng).

# (A) API Anthropic: giữ mặc định, chỉ cần ANTHROPIC_API_KEY hoặc `ant auth login`.

# (B) Rẻ nhất: mọi vai là Haiku.
# models:
#   cheap:  {model: "anthropic/claude-haiku-5-5", effort: low}
#   strong: {model: "anthropic/claude-haiku-5-5", effort: medium}
#   judge:  {model: "anthropic/claude-haiku-5-5", effort: medium}

# (C) Không có API key, đang dùng Claude Code: subagent trả lời (skill trong SKILL.md tự chạy vòng này).
#     Tên sau agent/claude- là model gợi ý cho subagent: haiku rẻ, sonnet tổng hợp luật tốt hơn.
# models:
#   cheap:  {model: "agent/claude-haiku"}
#   strong: {model: "agent/claude-sonnet"}
#   judge:  {model: "agent/claude-haiku"}

# (D) Bước 2 và 4 chạy trên máy (Ollama), không gửi lịch sử chat lên API; Bước 5, 6 vẫn dùng model mạnh.
# models:
#   cheap:  {model: "ollama/qwen3:14b"}

# (E) Chỉ dùng ChatGPT, có OpenAI API key (tạo ở platform.openai.com, tính tiền riêng với gói ChatGPT Plus/Pro).
#     Đặt OPENAI_API_KEY. Đổi tên model theo những model tài khoản bạn có.
# models:
#   cheap:  {model: "openai/gpt-5-mini", effort: low}
#   strong: {model: "openai/gpt-5", effort: medium}
#   judge:  {model: "openai/gpt-5", effort: medium}

# Lĩnh vực tuỳ chỉnh: xem ví dụ trong src/pc/config.default.yaml (capsule.custom_domains).
